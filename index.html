    <div id="app"></div>

    <script type="module">
      import {
        createElement,
        renderElement,
        patchElement,
      } from "/monFramework/index.js";

      const oldVnode = createElement("div", { class: "ancien" }, "Bonjour");
      const newVnode = createElement("div", { class: "nouveau" }, "Au revoir");
